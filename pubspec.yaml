name: media_core_workspace
publish_to: none
description: A reusable live playback core for Flutter applications.
version: 1.0.0
homepage: https://github.com/liuchuancong/media_core
repository: https://github.com/liuchuancong/media_core
environment:
  sdk: ">=3.9.0 <4.0.0"

workspace:
  - packages/media_core
  - packages/media_core_logging
  - packages/media_core_memory
  - packages/media_core_media_kit
  - packages/media_core_better_player
  - packages/media_core_cast_dlna
  - packages/media_core_native
  - packages/media_core_native/example
  - packages/media_core_notify
  - packages/media_core_ijk_player
  - packages/media_core_fvp
  - packages/media_core_audio
  - packages/media_core_ui
  - packages/media_core_mediasession
  - packages/media_core_presentation
  - packages/media_core_pip
  - packages/media_core_fullscreen
  - packages/media_core_win32
  - packages/media_core_danmaku
  - packages/media_core_live
  - packages/media_core_feed
  - packages/media_core_list_playback
  - packages/media_core_recording_ffmpeg
  - packages/media_core_download
  - packages/media_core_multiview
  - packages/media_core_ingest
  - example
dev_dependencies:
  kareki: ^0.7.0
  melos: ^8.9.0
  very_good_analysis: ^11.0.0
dependency_overrides:
  # Every published ffmpeg_kit_extended_flutter (0.5.x through the current
  # 0.6.2) declares code_assets ^1.2.1 / hooks ^2.0.2, while the media_kit
  # fork requires code_assets ^2.1.0. No upgrade reconciles them, so the
  # build-system side is forced up here and ffmpeg's hook then runs against a
  # major it did not declare. Treat that mismatch as the prime suspect for the
  # Windows extraction failure recorded in the project notes before assuming
  # the upstream hook is simply broken.
  code_assets: ^2.1.0
  flame_barrage: ^0.0.9
  hooks: ^2.2.0
  # media_kit_video pins wakelock_plus 1.3.3 while better_player_plus needs
  # ^1.7.0; without this the two backends cannot be resolved in one workspace.
  wakelock_plus: ^1.7.0

melos:
  scripts:
    upgrade:
      description: Upgrade workspace dependencies within current constraints.
      run: flutter pub upgrade
    upgrade:major:
      description: Upgrade dependencies and allow major version changes.
      run: flutter pub upgrade --major-versions
    outdated:
      description: Show outdated dependencies.
      run: flutter pub outdated
    get:
      description: Resolve workspace dependencies.
      run: flutter pub get
    gen:
      description: Run build_runner code generation in every package that uses it.
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn:
          - build_runner
      env:
        CI: "true"
    analyze:
      description: Run dart analyze in every workspace package.
      exec:
        command: dart analyze
        concurrency: 1
      env:
        CI: "true"
    test:
      description: Run tests in every workspace package.
      exec:
        command: flutter test
        concurrency: 1
    format:
      description: Format every workspace package.
      exec:
        command: dart format .
    kareki:
      description: Workspace-wide dead code scan; new findings fail, baselined ones pass.
      run: dart run kareki --baseline .kareki-baseline.json
