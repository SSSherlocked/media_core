name: media_core_win32
description: Direct Win32 (user32) window-state operations for media_core desktop presentations - snapshot/restore placement, frameless bounds moves and screen fullscreen via FFI, bypassing window_manager's frameless fast path.
version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # Win32 FFI bindings
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
