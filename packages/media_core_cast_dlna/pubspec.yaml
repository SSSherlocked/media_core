name: media_core_cast_dlna

description: DLNA/UPnP casting backend for media_core - SSDP discovery, device description parsing, SOAP AVTransport/RenderingControl commands and DIDL-Lite payloads behind the protocol-neutral MediaCastBackend interface.


version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues

resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # The protocol-neutral contract this package implements: MediaCastBackend,
  # CastDevice, CastMedia, CastPosition, CastEvent, CastException.
  media_core:
    ^0.1.0

  # Device description and SOAP response documents.
  xml: ^6.6.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
