name: media_core_media_kit
description: >-
  media_kit (libmpv) backend adapter for media_core: mpv-grade codec
  coverage and desktop playback behind the shared PlayerAdapter contract.
version: 0.1.0
# Blocked from publishing: media_kit / media_kit_video are pinned to the
# Predidit fork by commit (pub.dev forbids git deps in published packages).
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core
  media_core_logging:
    path: ../media_core_logging

  # SSSherlocked/media-kit (branch pure-live): Predidit/media-kit 6b188ae
  # plus the Android Surface patch in media_kit_video/PURELIVE_PATCH.md (a
  # Surface change neither seeks nor resets vo). setVideoOutputEnabled and the
  # Windows frameRevision of the older vendored copy are NOT in it, so nothing
  # here may depend on them. One source per dependency: the commit pin is
  # authoritative, no hosted fallback is possible.
  media_kit:
    git:
      url: https://github.com/SSSherlocked/media-kit.git
      ref: f38e69d275fe5759e01bfe6ba5de3c429663ca75
      path: ./media_kit

  media_kit_video:
    git:
      url: https://github.com/SSSherlocked/media-kit.git
      ref: f38e69d275fe5759e01bfe6ba5de3c429663ca75
      path: ./media_kit_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
