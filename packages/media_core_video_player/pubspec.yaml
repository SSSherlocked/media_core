name: media_core_video_player
description: >-
  AVPlayer backend adapter for media_core on macOS and iOS, through the
  official video_player AVFoundation implementation.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core
  # The platform interface and the Apple implementation only: the app-facing
  # video_player package would also pull its Android implementation, a second
  # ExoPlayer next to better_player's.
  video_player_platform_interface: ^6.9.0
  video_player_avfoundation: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
