name: media_core_list_playback
description: List playback for media_core - an ordered list played in one window, swiping up and down between items and resuming each item where it was left.
version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # PlaybackListState value equality.
  equatable: ^3.0.0

  flutter:
    sdk: flutter
  media_core:
    ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
