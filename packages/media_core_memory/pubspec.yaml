name: media_core_memory
description: Memory accounting for media_core - per-module reported footprint, budget thresholds with pressure levels, device snapshots and reports.
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Pressure transitions and reports are logged under the memory category
  media_core_logging:
    path: ../media_core_logging

  # Value equality for snapshots and reports
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
