name: media_core_notify

description: User-facing notifications for media_core - download and recording outcomes on Android, iOS, macOS, Windows and Linux, plus one aggregated foreground notification for running jobs.


version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues

resolution: workspace

environment:
  # flutter_local_notifications 22.x requires Dart 3.10 and Flutter 3.38.1; the
  # floor here is what that dependency makes true, not a choice.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  # The notification mechanism itself: Android, iOS, macOS, Windows and Linux
  # behind one API, including the foreground-service notification.
  flutter_local_notifications: ^22.3.2

  # The job-outcome contract this package registers itself into, so the download
  # and recording packages can report without depending on a notification plugin.
  media_core:
    ^0.1.0

  # The vocabulary a job is described in (`BackgroundNotification`,
  # `BackgroundJobKind`, `BackgroundProgress`) and the process protection this
  # package deliberately does not own on iOS/macOS/Windows.
  media_core_native:
    ^0.2.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# No `flutter: plugin:` section: this package ships no native code. The plugin
# it needs arrives through `flutter_local_notifications`, whose own registration
# covers Android, iOS, macOS, Linux and Windows.
