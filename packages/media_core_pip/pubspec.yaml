name: media_core_pip
description: Picture-in-picture for media_core - a desktop always-on-top small window and the Android system PiP window.
version: 0.1.0
# Blocked from publishing: the Android PiP backend `floating` is a patched
# git fork whose pub.dev name is taken.
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  media_core:
    path: ../media_core
  media_core_win32:
    path: ../media_core_win32
  # Desktop small window (Windows, macOS, Linux)
  native_picture_in_picture: ^1.0.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter
