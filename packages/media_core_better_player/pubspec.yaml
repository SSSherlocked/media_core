name: media_core_better_player
description: >-
  better_player_plus backend adapter for media_core: the shared
  PlayerAdapter contract on the stock Flutter video_player engines.
version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # The engine this adapter drives.
  better_player_plus: ^1.4.1

  flutter:
    sdk: flutter

  media_core:
    ^0.1.0

dev_dependencies:
  # Lint
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter
