name: media_core_recording_ffmpeg
description: FFmpeg recording backend for media_core - segmented MPEG-TS capture of network streams through ffmpeg_kit_extended_flutter.
version: 0.1.0
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # FFmpeg runtime (argument-list API, session control, statistics, FFprobe)
  ffmpeg_kit_extended_flutter: ^0.6.2

  flutter:
    sdk: flutter

  media_core:
    ^0.1.0

  # Background execution: a recording outlives the app being in the foreground,
  # and the platform has to be told that (foreground service + wake lock on
  # Android, sleep assertions elsewhere).
  media_core_native:
    ^0.2.0

  # Output paths are joined, not concatenated: a recording directory is written
  # by FFmpeg and read back by this package, and both sides need one separator
  # rule for a Windows path and a POSIX one to resolve to the same segment.
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
