name: media_core_recording_ffmpeg
description: FFmpeg recording backend for media_core - segmented MPEG-TS capture of network streams through ffmpeg_kit_extended_flutter.
version: 0.1.0
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Background execution: a recording outlives the app being in the foreground,
  # and the platform has to be told that (foreground service + wake lock on
  # Android, sleep assertions elsewhere).
  media_core_native:
    path: ../media_core_native
  media_core:
    path: ../media_core

  # FFmpeg runtime (argument-list API, session control, statistics)
  ffmpeg_kit_extended_flutter: 0.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
