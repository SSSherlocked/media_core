name: media_core_ijk_player
description: >-
  ijkplayer backend adapter for media_core on the flv_lzc fork: software
  decoding and legacy FLV handling behind the shared PlayerAdapter contract.
version: 0.1.0
# Blocked from publishing: flv_lzc is a git-only dependency
# (pub.dev forbids git deps in published packages).
publish_to: none
repository: https://github.com/liuchuancong/media_core
issue_tracker: https://github.com/liuchuancong/media_core/issues
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Fork of bmxclaud's flv decoder; pinned to a commit so the published
  # package resolves deterministically.
  flv_lzc:
    git:
      url: https://github.com/liuchuancong/flv_lzc.git
      ref: 162030d642857109048a8e6858d502b8d73c754a
  media_core:
    ^0.1.0
  media_core_logging:
    ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
